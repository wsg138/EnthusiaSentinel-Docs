name: Enthusia Wiki Preservation Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'wiki-preservation-trigger.txt'
      - 'scripts/wiki-preservation/**'
      - '.github/workflows/wiki-preservation-bridge.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture public Miraheze wiki read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wiki-preservation-output
          python3 scripts/wiki-preservation/snapshot_enthusia_wiki.py

      - name: Verify preservation output
        shell: bash
        run: |
          set -euo pipefail
          test -s wiki-preservation-output/manifest.json
          test -s wiki-preservation-output/review.json
          page_count="$(find wiki-preservation-output/pages -type f -name '*.wiki' | wc -l | tr -d ' ')"
          history_count="$(find wiki-preservation-output/history -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "page_count=$page_count history_count=$history_count"
          test "$page_count" -gt 0
          test "$history_count" -eq "$page_count"

      - name: Upload immutable preservation artifact
        uses: actions/upload-artifact@v4
        with:
          name: enthusia-wiki-pre-ai-baseline-${{ github.run_id }}
          path: wiki-preservation-output/
          if-no-files-found: error
          retention-days: 90

      - name: Persist immutable baseline branch
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a wiki-preservation-output/. "$work/"

          git config user.name 'Enthusia Wiki Preservation'
          git config user.email 'wiki-preservation@users.noreply.github.com'
          git switch --orphan wiki-preservation-baseline
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$work/." .
          git add .
          git commit -m 'Preserve pre-redesign Enthusia Miraheze baseline'

          if git ls-remote --exit-code --heads origin wiki-preservation-baseline >/dev/null 2>&1; then
            echo 'wiki-preservation-baseline already exists; refusing to replace immutable baseline.' >&2
            exit 1
          fi
          git push origin HEAD:wiki-preservation-baseline
