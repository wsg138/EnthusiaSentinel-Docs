name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate docs and examples
        run: python -m unittest discover -s test -p 'test_*.py' -v
